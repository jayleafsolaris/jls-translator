[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "translator"
version = "1.0.4"
description = "Translate Minecraft Bedrock .lang files into all languages supported by Minecraft"
requires-python = ">=3.8"
dependencies = [
    "deep-translator"
]

[project.scripts]
translator = "translator.translator:main"

[tool.setuptools]
packages = ["translator"]
